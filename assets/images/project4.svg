<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#p4Grad)"/>
  <rect width="600" height="42" rx="16" fill="#0f172a"/>
  <rect y="20" width="600" height="22" fill="#0f172a"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="90" y="25" fill="#38bdf8" font-family="monospace" font-size="12">sync-editor.ts — Collaborators (4 Online)</text>

  <g transform="translate(30, 60)">
    <!-- Sidebar -->
    <rect width="130" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="25" fill="#64748b" font-family="system-ui" font-size="11" font-weight="bold">EXPLORER</text>
    <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="11">📄 main.tsx</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="11">📄 server.go</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="11">📄 socket.ts</text>
    <text x="15" y="130" fill="#94a3b8" font-family="monospace" font-size="11">📄 schema.sql</text>

    <!-- Code Editor View -->
    <rect x="145" y="0" width="395" height="270" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="165" y="35" fill="#f43f5e" font-family="monospace" font-size="12">export async function <tspan fill="#38bdf8">initCRDTSync</tspan>(docId: <tspan fill="#a855f7">string</tspan>) {</text>
    <text x="180" y="65" fill="#64748b" font-family="monospace" font-size="12">// Distributed Operational Transforms &amp; Vector Clock</text>
    <text x="180" y="95" fill="#38bdf8" font-family="monospace" font-size="12">  const peerCluster = <tspan fill="#fbbf24">await</tspan> connectMesh({</text>
    <text x="200" y="125" fill="#e2e8f0" font-family="monospace" font-size="12">    heartbeatMs: 250,</text>
    <text x="200" y="155" fill="#e2e8f0" font-family="monospace" font-size="12">    p2pEncryption: <tspan fill="#22c55e">true</tspan></text>
    <text x="180" y="185" fill="#38bdf8" font-family="monospace" font-size="12">  });</text>
    <text x="180" y="215" fill="#fbbf24" font-family="monospace" font-size="12">  return peerCluster.listen();</text>
    <text x="165" y="245" fill="#f43f5e" font-family="monospace" font-size="12">}</text>

    <!-- Collaborator Cursor -->
    <rect x="360" y="145" width="2" height="18" fill="#ec4899"/>
    <rect x="360" y="128" width="55" height="18" rx="4" fill="#ec4899"/>
    <text x="365" y="141" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold">Alex (Host)</text>
  </g>
</svg>
