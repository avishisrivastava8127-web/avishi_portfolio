<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#p1Grad)"/>
  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#1e293b"/>
  <rect y="20" width="600" height="22" fill="#1e293b"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <rect x="150" y="11" width="300" height="20" rx="10" fill="#0f172a" opacity="0.6"/>
  <text x="300" y="25" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">https://cogniverse-ai.platform.dev</text>

  <!-- Content Graphic -->
  <g transform="translate(40, 70)">
    <!-- Search Bar -->
    <rect width="520" height="48" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="24" y="29" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Ask CogniVerse anything with neural multi-modal reasoning...</text>
    <rect x="420" y="8" width="88" height="32" rx="8" fill="url(#neonCyan)"/>
    <text x="464" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Generate</text>

    <!-- Cards Grid -->
    <rect x="0" y="70" width="245" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="100" r="16" fill="#06b6d4" opacity="0.2"/>
    <text x="35" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AI</text>
    <rect x="65" y="92" width="120" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="65" y="110" width="80" height="8" rx="4" fill="#64748b"/>
    <rect x="25" y="140" width="195" height="45" rx="8" fill="#0f172a"/>
    <text x="35" y="166" fill="#38bdf8" font-family="monospace" font-size="11">Context tokens: 1.2M (99.8% acc)</text>

    <rect x="275" y="70" width="245" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="310" cy="100" r="16" fill="#8b5cf6" opacity="0.2"/>
    <text x="310" y="105" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ML</text>
    <rect x="340" y="92" width="130" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="340" y="110" width="90" height="8" rx="4" fill="#64748b"/>
    <path d="M 295 190 Q 340 145, 385 165 T 485 140" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="485" cy="140" r="4" fill="#c084fc"/>
  </g>
</svg>
