    <text x="28" y="30" fill="#34d399" font-family="system-ui" font-size="12" font-weight="900" text-anchor="middle">🌱</text>
    <text x="48" y="24" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="800">BioChain · Mandi Arbitrage Engine</text>
    <text x="48" y="40" fill="#a7f3d0" font-family="system-ui" font-size="11">Autonomous APMC Price Feeds &amp; Smart Contracts</text>

    <rect x="420" y="12" width="95" height="28" rx="14" fill="url(#goldAccent)"/>
    <text x="467" y="30" fill="#0f172a" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">LIVE VERIFIED</text>

    <!-- Left Box: Arbitrage Corridors -->
    <rect x="0" y="68" width="310" height="200" rx="12" fill="#022c22" stroke="#065f46" stroke-width="1"/>
    <text x="20" y="95" fill="#6ee7b7" font-family="system-ui" font-size="12" font-weight="700">CROSS-MANDI PRICE CORRIDOR</text>
    
    <!-- Corridor Item 1 -->
    <rect x="15" y="110" width="280" height="38" rx="8" fill="#064e3b"/>
    <text x="28" y="133" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">Nashik ➔ Mumbai Vashi APMC</text>
    <text x="280" y="133" fill="#34d399" font-family="system-ui" font-size="12" font-weight="800" text-anchor="end">+₹480/MT</text>

    <!-- Corridor Item 2 -->
    <rect x="15" y="156" width="280" height="38" rx="8" fill="#064e3b"/>
    <text x="28" y="179" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">Indore Soy ➔ Delhi Azadpur</text>
    <text x="280" y="179" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="800" text-anchor="end">+₹620/MT</text>

    <!-- Corridor Item 3 -->
    <rect x="15" y="202" width="280" height="38" rx="8" fill="#064e3b"/>
    <text x="28" y="225" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">Pune Gultekdi ➔ Bangalore</text>
    <text x="280" y="225" fill="#34d399" font-family="system-ui" font-size="12" font-weight="800" text-anchor="end">+₹350/MT</text>

    <!-- Right Box: Smart Contract Escrow -->
    <rect x="330" y="68" width="200" height="200" rx="12" fill="#022c22" stroke="#d97706" stroke-width="1"/>
    <text x="345" y="95" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700">SMART CONTRACT</text>
    
    <rect x="345" y="110" width="170" height="55" rx="8" fill="#064e3b"/>
    <text x="355" y="130" fill="#94a3b8" font-family="system-ui" font-size="10">Escrow Contract #4892</text>
    <text x="355" y="152" fill="#34d399" font-family="system-ui" font-size="15" font-weight="800">₹ 2,45,000</text>

    <rect x="345" y="175" width="170" height="40" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="0.8"/>
    <text x="355" y="193" fill="#a7f3d0" font-family="monospace" font-size="9">✓ FSSAI QC Passed</text>
    <text x="355" y="206" fill="#a7f3d0" font-family="monospace" font-size="9">✓ Transit Cap: 3% Max</text>

    <rect x="345" y="225" width="170" height="32" rx="6" fill="url(#emeraldBar)"/>
    <text x="430" y="246" fill="#022c22" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">Signed &amp; Dispatched ➔</text>
