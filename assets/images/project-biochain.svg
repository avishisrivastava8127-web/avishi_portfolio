<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="600" height="360" rx="16" fill="url(#bioGrad)"/>

  <!-- Browser Header -->
  <rect width="600" height="42" rx="16" fill="#064e3b"/>
  <rect y="20" width="600" height="22" fill="#064e3b"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <rect x="140" y="11" width="320" height="20" rx="10" fill="#022c22" opacity="0.7"/>
  <text x="300" y="25" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">https://fantasticfive-hg-26.vercel.app</text>

  <!-- Inner Dashboard -->
  <g transform="translate(35, 65)">
    <!-- Top Bar with Badges -->
    <rect width="530" height="52" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
